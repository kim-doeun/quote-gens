<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객사 관리 | Lomin 견적관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans KR',sans-serif;}</style>
</head>
<body class="bg-[#f4f5f9]" data-page="customers.html">

<div class="flex flex-col lg:flex-row min-h-screen">
  <div id="sidebar-mount"></div>

  <main class="flex-1 p-4 md:p-8">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">고객사 관리</h1>
        <p class="text-slate-500 text-sm mt-1">견적서 발급에 사용할 고객사 정보를 등록하고 관리하세요.</p>
      </div>
      <button id="btn-new-customer" class="btn btn-primary"><i class="fa-solid fa-plus"></i> 고객사 등록</button>
    </header>

    <section class="card p-4 mb-5">
      <div class="relative max-w-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" class="input" style="padding-left:2.2rem;" placeholder="회사명, 담당자, 업종 검색">
      </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="customers-grid">
      <div class="text-center text-slate-400 py-10 col-span-full">불러오는 중...</div>
    </section>
  </main>
</div>

<!-- 등록/수정 모달 -->
<div id="customer-modal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width: 560px;">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-800" id="customer-modal-title">고객사 등록</h3>
      <button onclick="closeCustomerModal()" class="btn-ghost btn text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <input type="hidden" id="c-id">
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">회사명 *</label>
        <input type="text" id="c-company-name" class="input" placeholder="㈜회사명">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">사업자등록번호</label>
        <input type="text" id="c-business-number" class="input" placeholder="000-00-00000">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">업종</label>
        <input type="text" id="c-industry" class="input" placeholder="예: 물류, 금융">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">담당자명</label>
        <input type="text" id="c-contact-name" class="input" placeholder="홍길동">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">담당자 직급</label>
        <input type="text" id="c-contact-position" class="input" placeholder="과장">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">연락처</label>
        <input type="text" id="c-phone" class="input" placeholder="02-0000-0000">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">이메일</label>
        <input type="email" id="c-email" class="input" placeholder="example@company.com">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">주소</label>
        <input type="text" id="c-address" class="input" placeholder="회사 주소">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">비고</label>
        <textarea id="c-notes" class="input" rows="2" placeholder="특이사항 메모"></textarea>
      </div>
    </div>
    <div class="p-5 border-t border-slate-100 flex justify-end gap-2">
      <button onclick="closeCustomerModal()" class="btn btn-secondary">취소</button>
      <button onclick="saveCustomer()" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
