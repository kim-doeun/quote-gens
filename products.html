<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S/W 라이선스 관리 | Lomin 견적관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans KR',sans-serif;}</style>
</head>
<body class="bg-[#f4f5f9]" data-page="products.html">

<div class="flex flex-col lg:flex-row min-h-screen">
  <div id="sidebar-mount"></div>

  <main class="flex-1 p-4 md:p-8">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">S/W 라이선스 관리</h1>
        <p class="text-slate-500 text-sm mt-1">견적서 "01. S/W 라이선스" 섹션에 사용할 제품 카탈로그를 관리하세요. (소비자단가/제안단가 기준)</p>
      </div>
      <button id="btn-new-product" class="btn btn-primary"><i class="fa-solid fa-plus"></i> 제품 등록</button>
    </header>

    <section class="card p-4 mb-5">
      <div class="flex flex-wrap gap-3">
        <div class="relative max-w-sm flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" class="input" style="padding-left:2.2rem;" placeholder="제품명, 설명 검색">
        </div>
        <select id="filter-category" class="input" style="width:auto;">
          <option value="">전체 분류</option>
          <option value="라이선스">라이선스</option>
          <option value="구독">구독</option>
        </select>
      </div>
    </section>

    <section class="card p-0 overflow-hidden">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>제품명</th>
              <th>분류</th>
              <th>단위</th>
              <th class="text-right">소비자단가(LP)</th>
              <th class="text-right">제안단가(P)</th>
              <th>판매상태</th>
              <th style="width:1%"></th>
            </tr>
          </thead>
          <tbody id="products-body">
            <tr><td colspan="7" class="text-center text-slate-400 py-10">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- 등록/수정 모달 -->
<div id="product-modal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width: 560px;">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-800" id="product-modal-title">제품 등록</h3>
      <button onclick="closeProductModal()" class="btn-ghost btn text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 flex flex-col gap-4">
      <input type="hidden" id="p-id">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">제품명 *</label>
        <input type="text" id="p-name" class="input" placeholder="예: Zixy-DocParser">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">분류</label>
          <select id="p-category" class="input">
            <option value="라이선스">라이선스</option>
            <option value="구독">구독</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">판매 단위</label>
          <input type="text" id="p-unit" class="input" placeholder="예: License, EA, 개월">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">소비자단가 (LP, 정가)</label>
          <input type="number" id="p-list-price" class="input text-right" min="0" placeholder="0">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">제안단가 (P, 기본 할인가)</label>
          <input type="number" id="p-price" class="input text-right" min="0" placeholder="0">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">설명 (줄바꿈으로 여러 항목 기재 가능)</label>
        <textarea id="p-description" class="input" rows="4" placeholder="- 주요 기능 1&#10;- 주요 기능 2"></textarea>
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" id="p-active" checked class="w-4 h-4"> 판매중 (견적서 항목 선택 목록에 표시)
      </label>
    </div>
    <div class="p-5 border-t border-slate-100 flex justify-end gap-2">
      <button onclick="closeProductModal()" class="btn btn-secondary">취소</button>
      <button onclick="saveProduct()" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/products.js"></script>
</body>
</html>
