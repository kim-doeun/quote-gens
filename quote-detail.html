<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적서 상세 | Lomin 견적관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans KR',sans-serif;}</style>
</head>
<body class="bg-[#f4f5f9]" data-page="quotes.html">

<div class="flex flex-col lg:flex-row min-h-screen">
  <div id="sidebar-mount" class="no-print"></div>

  <main class="flex-1 p-4 md:p-8">
    <!-- 액션 헤더 -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 no-print">
      <div class="flex items-center gap-3">
        <a href="quotes.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
          <h1 class="text-2xl font-bold text-slate-800">견적서 상세</h1>
          <p class="text-slate-500 text-sm mt-1" id="page-subtitle">불러오는 중...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <select id="status-select" class="input" style="width:auto;">
          <option value="발송전">발송전</option>
          <option value="발송됨">발송됨</option>
          <option value="내부협의중">내부협의중</option>
          <option value="계약됨">계약됨</option>
          <option value="만료됨">만료됨</option>
          <option value="재발행됨">재발행됨</option>
        </select>
        <button id="btn-revise" class="btn btn-secondary"><i class="fa-solid fa-code-branch"></i> 새 버전으로 재발행</button>
        <button id="btn-excel" class="btn btn-secondary"><i class="fa-solid fa-file-excel" style="color:#16a34a;"></i> 엑셀 다운로드</button>
        <!-- 인쇄/PDF 메뉴: 요청에 따라 화면에서만 숨김 처리(코드/기능은 유지). 다시 노출하려면 아래 style="display:none;"만 제거하면 됩니다. -->
        <button id="btn-print" class="btn btn-secondary" style="display:none;"><i class="fa-solid fa-print"></i> 인쇄/PDF</button>
        <button id="btn-delete" class="btn btn-danger"><i class="fa-solid fa-trash"></i> 삭제</button>
      </div>
    </header>

    <!-- 버전 히스토리 (동일 건이 재발행으로 여러 버전 발행된 경우에만 표시, 화면 전용) -->
    <div id="version-history-box" class="no-print max-w-4xl mx-auto mb-6 hidden"></div>

    <!-- 내부 메모 (화면 전용, 인쇄/PDF/엑셀에는 절대 포함되지 않음) -->
    <div id="internal-memo-box" class="no-print max-w-4xl mx-auto mb-6 hidden"></div>

    <!-- 인쇄 영역 -->
    <div id="print-area">
      <div class="card quote-doc p-6 md:p-10 max-w-4xl mx-auto" id="quote-content">
        <div class="text-center text-slate-400 py-20">불러오는 중...</div>
      </div>
    </div>
  </main>
</div>

<script src="js/common.js"></script>
<script src="js/quote-excel-template.js"></script>
<script src="js/quote-detail.js"></script>
</body>
</html>
