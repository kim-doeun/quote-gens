services:
  app:
    build: .
    image: lomin-quote:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/app.db
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - lomin-quote-data:/data

volumes:
  lomin-quote-data:
