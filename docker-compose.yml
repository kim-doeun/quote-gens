services:
  app:
    build: .
    image: quote-gens:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/app.db
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - quote-gens-data:/data

volumes:
  quote-gens-data:
