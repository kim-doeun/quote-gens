<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 | Lomin 견적관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans KR',sans-serif;}</style>
</head>
<body class="bg-[#f4f5f9]" data-page="index.html">

<div class="flex flex-col lg:flex-row min-h-screen">
  <div id="sidebar-mount"></div>

  <main class="flex-1 p-4 md:p-8">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">대시보드</h1>
        <p class="text-slate-500 text-sm mt-1">Lomin 견적서 발급 및 이력 현황을 한눈에 확인하세요.</p>
      </div>
      <a href="quote-new.html" class="btn btn-primary self-start md:self-auto">
        <i class="fa-solid fa-plus"></i> 새 견적서 발급
      </a>
    </header>

    <!-- 필터 바 -->
    <section class="card p-4 mb-6">
      <div class="flex flex-wrap items-center gap-3">
        <span class="text-xs font-semibold text-slate-500">기간</span>
        <div class="filter-toggle-group" id="period-mode-toggle">
          <button type="button" class="filter-toggle-btn active" data-mode="month">월별</button>
          <button type="button" class="filter-toggle-btn" data-mode="range">기간별</button>
        </div>

        <div class="relative">
          <button type="button" id="period-value-btn" class="btn btn-secondary text-sm">
            <span id="period-value-label">-</span> <i class="fa-solid fa-chevron-down text-xs"></i>
          </button>
          <div id="period-popover" class="filter-popover hidden">
            <div id="month-picker-panel">
              <div class="flex items-center justify-between mb-3">
                <button type="button" id="month-year-prev" class="btn-ghost btn" style="padding:0.3rem 0.55rem;"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="month-year-label" class="font-bold text-slate-800">-</span>
                <button type="button" id="month-year-next" class="btn-ghost btn" style="padding:0.3rem 0.55rem;"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
              <div id="month-grid" class="grid grid-cols-4 gap-2"></div>
            </div>
            <div id="range-picker-panel" class="hidden">
              <div class="flex flex-wrap gap-2 mb-3" id="range-preset-group">
                <button type="button" class="preset-pill" data-preset="1w">1주일</button>
                <button type="button" class="preset-pill" data-preset="1m">1개월</button>
                <button type="button" class="preset-pill" data-preset="3m">3개월</button>
                <button type="button" class="preset-pill" data-preset="6m">6개월</button>
                <button type="button" class="preset-pill" data-preset="1y">1년</button>
                <button type="button" class="preset-pill" data-preset="custom">기간설정</button>
              </div>
              <div class="flex items-center gap-2">
                <input type="date" id="range-from" class="input text-sm">
                <span class="text-slate-400 text-sm">~</span>
                <input type="date" id="range-to" class="input text-sm">
              </div>
            </div>
          </div>
        </div>

        <span class="text-xs font-semibold text-slate-500 ml-2">영업대표</span>
        <div class="relative">
          <button type="button" id="rep-value-btn" class="btn btn-secondary text-sm">
            <span id="rep-value-label">전체</span> <i class="fa-solid fa-chevron-down text-xs"></i>
          </button>
          <div id="rep-popover" class="filter-popover hidden" style="min-width:220px;">
            <input type="text" id="rep-search" class="input text-sm mb-2" placeholder="이름 검색">
            <div class="flex flex-col gap-1 max-h-56 overflow-y-auto" id="rep-option-list"></div>
          </div>
        </div>

        <div class="ml-auto flex items-center gap-2">
          <button type="button" id="btn-filter-reset" class="btn btn-secondary text-sm">초기화</button>
          <button type="button" id="btn-filter-apply" class="btn btn-primary text-sm">조회</button>
        </div>
      </div>
    </section>

    <!-- 요약 카드: 상태별 건수/금액 (전체 → 계약됨 → 내부협의중 → 발송됨 → 발송전 → 만료됨) -->
    <section class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-3 mb-8">
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="text-slate-500 text-xs font-semibold">전체</p>
          <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        </div>
        <p class="text-xl font-bold text-slate-800 mt-2" id="stat-전체-count">0건</p>
        <p class="text-slate-400 text-xs mt-0.5" id="stat-전체-amount">0원</p>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="text-slate-500 text-xs font-semibold">계약됨</p>
          <div class="w-8 h-8 rounded-lg bg-green-50 text-green-600 flex items-center justify-center text-xs"><i class="fa-solid fa-circle-check"></i></div>
        </div>
        <p class="text-xl font-bold text-slate-800 mt-2" id="stat-계약됨-count">0건</p>
        <p class="text-slate-400 text-xs mt-0.5" id="stat-계약됨-amount">0원</p>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="text-slate-500 text-xs font-semibold">내부협의중</p>
          <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xs"><i class="fa-solid fa-comments"></i></div>
        </div>
        <p class="text-xl font-bold text-slate-800 mt-2" id="stat-내부협의중-count">0건</p>
        <p class="text-slate-400 text-xs mt-0.5" id="stat-내부협의중-amount">0원</p>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="text-slate-500 text-xs font-semibold">발송됨</p>
          <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xs"><i class="fa-solid fa-paper-plane"></i></div>
        </div>
        <p class="text-xl font-bold text-slate-800 mt-2" id="stat-발송됨-count">0건</p>
        <p class="text-slate-400 text-xs mt-0.5" id="stat-발송됨-amount">0원</p>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="text-slate-500 text-xs font-semibold">발송전</p>
          <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></div>
        </div>
        <p class="text-xl font-bold text-slate-800 mt-2" id="stat-발송전-count">0건</p>
        <p class="text-slate-400 text-xs mt-0.5" id="stat-발송전-amount">0원</p>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between">
          <p class="text-slate-500 text-xs font-semibold">만료됨</p>
          <div class="w-8 h-8 rounded-lg bg-rose-50 text-rose-500 flex items-center justify-center text-xs"><i class="fa-solid fa-clock"></i></div>
        </div>
        <p class="text-xl font-bold text-slate-800 mt-2" id="stat-만료됨-count">0건</p>
        <p class="text-slate-400 text-xs mt-0.5" id="stat-만료됨-amount">0원</p>
      </div>
    </section>

    <!-- 차트 영역 -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8">
      <div class="card p-5 lg:col-span-2">
        <h2 class="font-bold text-slate-800 mb-1">월별 견적발행/계약 금액</h2>
        <p class="text-slate-400 text-xs mb-4" id="monthly-chart-caption">-</p>
        <div style="height:280px;">
          <canvas id="monthlyChart"></canvas>
        </div>
        <p class="text-slate-400 mt-2" style="font-size:0.7rem;">X축: 선택 기간 연도의 1~12월 고정 / 기간별 선택 시 최근 12개월 기준</p>
      </div>
      <div class="card p-5">
        <h2 class="font-bold text-slate-800 mb-1">상태별 분포</h2>
        <p class="text-slate-400 text-xs mb-4">선택된 기간/영업대표 기준 상태 비율</p>
        <div style="height:280px;">
          <canvas id="statusChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 최근 견적서 -->
    <section class="card p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-slate-800">최근 견적서</h2>
        <a href="quotes.html" class="text-indigo-600 text-sm font-semibold hover:underline">전체 이력 보기 <i class="fa-solid fa-arrow-right ml-1"></i></a>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>견적번호</th>
              <th>고객사</th>
              <th>영업대표</th>
              <th>발행일</th>
              <th class="text-right">총액</th>
              <th>상태</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="recent-quotes-body">
            <tr><td colspan="7" class="text-center text-slate-400 py-8">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
