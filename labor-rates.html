<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인건비 단가 관리 | Lomin 견적관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans KR',sans-serif;}</style>
</head>
<body class="bg-[#f4f5f9]" data-page="labor-rates.html">

<div class="flex flex-col lg:flex-row min-h-screen">
  <div id="sidebar-mount"></div>

  <main class="flex-1 p-4 md:p-8">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">인건비 단가 관리</h1>
        <p class="text-slate-500 text-sm mt-1">견적서 "02. 개발비" 섹션에서 사용할 등급별 인월(M/M) 단가를 관리하세요.</p>
      </div>
      <button id="btn-new-rate" class="btn btn-primary"><i class="fa-solid fa-plus"></i> 단가 등록</button>
    </header>

    <section class="card p-0 overflow-hidden">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>등급</th>
              <th>기본 담당(역할)</th>
              <th class="text-right">인월(M/M)당 단가</th>
              <th>설명</th>
              <th style="width:1%"></th>
            </tr>
          </thead>
          <tbody id="rates-body">
            <tr><td colspan="5" class="text-center text-slate-400 py-10">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- 등록/수정 모달 -->
<div id="rate-modal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width: 480px;">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-800" id="rate-modal-title">단가 등록</h3>
      <button onclick="closeRateModal()" class="btn-ghost btn text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 flex flex-col gap-4">
      <input type="hidden" id="r-id">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">등급 *</label>
        <select id="r-grade" class="input">
          <option value="특급">특급</option>
          <option value="고급">고급</option>
          <option value="중급">중급</option>
          <option value="초급">초급</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">기본 담당(역할)</label>
        <input type="text" id="r-role" class="input" placeholder="예: BE 엔지니어">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">인월(M/M)당 단가 (원)</label>
        <input type="number" id="r-rate" class="input text-right" min="0" placeholder="0">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">설명</label>
        <textarea id="r-description" class="input" rows="2" placeholder="담당 업무 설명"></textarea>
      </div>
    </div>
    <div class="p-5 border-t border-slate-100 flex justify-end gap-2">
      <button onclick="closeRateModal()" class="btn btn-secondary">취소</button>
      <button onclick="saveRate()" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/labor-rates.js"></script>
</body>
</html>
