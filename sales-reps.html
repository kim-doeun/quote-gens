<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업대표 관리 | Lomin 견적관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<style>body{font-family:'Noto Sans KR',sans-serif;}</style>
</head>
<body class="bg-[#f4f5f9]" data-page="sales-reps.html">

<div class="flex flex-col lg:flex-row min-h-screen">
  <div id="sidebar-mount"></div>

  <main class="flex-1 p-4 md:p-8">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">영업대표 관리</h1>
        <p class="text-slate-500 text-sm mt-1">견적서 발급 시 "견적담당(영업대표) 정보"로 선택할 견적담당정보(영업대표명/이메일/연락처)를 관리하세요.</p>
      </div>
      <button id="btn-new-rep" class="btn btn-primary"><i class="fa-solid fa-plus"></i> 영업대표 등록</button>
    </header>

    <section class="card p-0 overflow-hidden">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>영업대표명</th>
              <th>이메일</th>
              <th>연락처</th>
              <th style="width:1%"></th>
            </tr>
          </thead>
          <tbody id="reps-body">
            <tr><td colspan="4" class="text-center text-slate-400 py-10">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- 등록/수정 모달 -->
<div id="rep-modal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width: 480px;">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-800" id="rep-modal-title">영업대표 등록</h3>
      <button onclick="closeRepModal()" class="btn-ghost btn text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 flex flex-col gap-4">
      <input type="hidden" id="sr-id">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">영업대표명 *</label>
        <input type="text" id="sr-name" class="input" placeholder="예: 김영업">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">이메일</label>
        <input type="email" id="sr-email" class="input" placeholder="rep@lomin.co.kr">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">연락처</label>
        <input type="text" id="sr-phone" class="input" placeholder="010-0000-0000">
      </div>
    </div>
    <div class="p-5 border-t border-slate-100 flex justify-end gap-2">
      <button onclick="closeRepModal()" class="btn btn-secondary">취소</button>
      <button onclick="saveRep()" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/sales-reps.js"></script>
</body>
</html>
